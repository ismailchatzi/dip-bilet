[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Public / kısa değerler secret scan'de false-positive veriyor
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,DEALS_CACHE_HOURS,MIN_DISCOUNT_PERCENT,RESEND_FROM_EMAIL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Saatler UTC (TR = UTC+3).
# Scrappa: 07/14/22 TR = 04/11/19 UTC.
# SerpAPI Deals: 01/03/07/12/14/17/19/22 TR = 22/00/04/09/11/14/16/19 UTC.
